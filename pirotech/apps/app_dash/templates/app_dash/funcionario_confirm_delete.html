{% extends 'app_dash/base.html' %}

{% block content %}
  <h2>Confirmar Exclusão</h2>
  <p>Tem certeza de que deseja excluir o usuário <strong>{{ funcionario.username }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Excluir</button>
    <a href="{% url 'funcionarios_list' %}" class="btn btn-secondary">Cancelar</a>
  </form>
{% endblock %}
