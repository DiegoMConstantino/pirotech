{% extends 'app_cadastro/base.html' %}

{% block content %}
<div class="bg-gradient-to-bl from-yellow-200 to-yellow-300 p-8 rounded-2xl shadow-md w-96">
    <h2 class="Poppins,sans-serif text-3xl font-bold text-center mb-6">Cadastre-se</h2>
    <form class="space-y-4">
        <input type="text" placeholder="E-mail" class="w-full border p-2 rounded">
        <input type="text" placeholder="Nome de Usuário" class="w-full border p-2 rounded">
        <input type="password" placeholder="Senha" class="w-full border p-2 rounded">
        <input type="password" placeholder="Confirmar Senha" class="w-full border p-2 rounded">
        {% include 'componentes/botao.html' with label_do_botao='Cadastrar-se' %}
    </form>
</div>
{% endblock %}
